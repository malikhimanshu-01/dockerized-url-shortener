services:
  postgres:
    image: postgres:16-alpine
    env_file:
      - .env
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - backend-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    networks:
      - backend-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  backend:
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
    networks:
      - frontend-net
      - backend-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    environment:
      # Same-origin: the browser reaches everything through the proxy, so relative /api
      # calls resolve correctly regardless of which host port the proxy is published on.
      API_BASE_URL: ""
    networks:
      - frontend-net
    depends_on:
      backend:
        condition: service_healthy

  proxy:
    build:
      context: ./proxy
    ports:
      - "${NGINX_PORT:-80}:8080"
    networks:
      - frontend-net
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy

networks:
  frontend-net:
  backend-net:

volumes:
  pgdata:
