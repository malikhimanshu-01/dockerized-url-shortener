worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    upstream frontend_upstream {
        server frontend:8080;
    }

    upstream backend_upstream {
        server backend:8000;
    }

    server {
        listen 8080;
        server_name _;

        # Decoupled from frontend/backend health on purpose: this only proves nginx itself is up.
        location = /nginx-health {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        location /api/ {
            proxy_pass http://backend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # FastAPI's auto-generated docs routes. These don't match the short-code regex below
        # (openapi.json has a dot in it), so without an explicit rule they'd silently fall
        # through to the frontend's SPA catch-all instead of reaching the backend — /docs
        # would load its HTML shell but fail to fetch the actual schema. Exact-match
        # locations are checked before any prefix or regex location, so these are unambiguous.
        location = /docs {
            proxy_pass http://backend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /redoc {
            proxy_pass http://backend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /openapi.json {
            proxy_pass http://backend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Short-link redirects: a single path segment, alnum, 3-16 chars — matches the
        # short_code length backend/app/schemas.py enforces (LinkCreate.short_code) and what
        # _generate_short_code() produces. Anything not matching this falls through to the
        # frontend SPA below, so top-level frontend routes must avoid this shape.
        location ~ "^/[A-Za-z0-9]{3,16}$" {
            proxy_pass http://backend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            proxy_pass http://frontend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
